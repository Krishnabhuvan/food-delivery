apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtime-service
  template:
    metadata:
      labels:
        app: realtime-service
    spec:
      containers:
      - name: realtime-service
        image: krishnaandbhuvan/realtime-service:latest
        ports:
        - containerPort: 4005
        env:
        - name: PORT
          value: "4005"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: RABBITMQ_URL
          value: amqp://rabbitmq:5672
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-service
spec:
  selector:
    app: realtime-service
  ports:
  - port: 4005
    targetPort: 4005